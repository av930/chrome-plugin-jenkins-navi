<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jenkins Job Config Compare</title>
  <link rel="stylesheet" href="compare_page.css">
</head>
<body>
  <header class="topbar">
    <h1>Job Config Compare</h1>
    <span id="diffCount" class="badge"></span>
    <label class="toggle"><input type="radio" name="viewMode" value="raw" checked disabled> 원문으로 비교</label>
    <label class="toggle"><input type="radio" name="viewMode" value="table" disabled> Table로 비교</label>
    <label class="toggle"><input type="radio" name="viewMode" value="diff" disabled> Table diff only</label>
    <div class="diff-nav">
      <button id="nextDiff" type="button" title="다음 diff" disabled>▼</button>
      <span>diff</span>
      <button id="prevDiff" type="button" title="이전 diff" disabled>▲</button>
    </div>
    <span id="status" class="status">Loading...</span>
  </header>

  <div class="panes-head">
    <div class="pane-title left">
      <a id="leftLink" target="_blank" rel="noopener"></a>
      <button id="saveLeft" class="save-btn" type="button" title="이 화면 내부에서 변경값을 저장합니다. 기존 job tab이 필요 없으며 새 tab은 만들지 않습니다" disabled hidden>Save</button>
    </div>
    <div class="pane-title right">
      <a id="rightLink" target="_blank" rel="noopener"></a>
      <button id="saveRight" class="save-btn" type="button" title="이 화면 내부에서 변경값을 저장합니다. 기존 job tab이 필요 없으며 새 tab은 만들지 않습니다" disabled hidden>Save</button>
    </div>
  </div>

  <div id="scroller" class="scroller" hidden>
    <div id="grid" class="grid"></div>
  </div>

  <!-- 원문(Jenkins configure 페이지) 형식 비교: 좌/우 iframe -->
  <div id="rawView" class="raw-view" hidden>
    <iframe id="rawLeft"></iframe>
    <iframe id="rawRight"></iframe>
  </div>

  <dialog id="saveProgress" class="save-progress">
    <p id="saveProgressText" role="status">Jenkins에 저장 중…</p>
    <iframe id="saveFrame" title="Jenkins 저장 처리" src="about:blank" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
  </dialog>

  <script src="compare_extract.js"></script>
  <script src="compare_page.js"></script>
</body>
</html>
