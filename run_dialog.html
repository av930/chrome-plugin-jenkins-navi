<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jenkins Navigator</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Run Dialog specific styles */
    body.run-dialog-mode {
      width: 1040px;
      height: 450px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #runDialogContent {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: auto;
      box-sizing: border-box;
      padding: 0 20px;
    }

    #runDialogContent h3 {
      margin: 0;
      padding: 15px 0 10px 0;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }

    #runDialogContent textarea {
      width: 1000px;
      padding: 8px;
      margin: 0 0 10px 0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      background-color: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #555;
      border-radius: 4px;
      resize: vertical;
      box-sizing: border-box;
      min-height: calc(1.5em * 5 + 16px);
      height: calc(1.5em * 5 + 16px);
    }

    #runDialogContent #previousParams {
      background-color: #2d2d30;
      color: #858585;
      cursor: not-allowed;
    }

    #runDialogContent textarea:focus {
      outline: none;
      border-color: #4caf50;
    }

    #runDialogContent .button-container {
      display: flex;
      gap: 10px;
      padding: 10px 0 15px 0;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .button-container button {
      padding: 8px 20px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .button-container .run-btn-exec {
      background-color: #4caf50;
      color: white;
    }

    .button-container .run-btn-exec:hover {
      background-color: #45a049;
    }

    .button-container .cancel-btn {
      background-color: #666;
      color: white;
    }

    .button-container .cancel-btn:hover {
      background-color: #777;
    }

    #hiddenFrame {
      display: none;
    }

    /* Search mode (Config/Log/Name): window 크기에 맞춰 폭/높이가 유동적으로 변한다 */
    html:has(body.search-mode) {
      width: auto;
      height: 100%;
    }

    body.run-dialog-mode.search-mode {
      width: auto;
      min-width: 1040px; /* 좌우 padding 20px씩 제외하고 내용 최소 1000px */
      height: 100vh;
      overflow-x: auto;
    }

    .search-mode #runDialogContent {
      height: 100%;
    }

    .search-mode #runDialogContent textarea {
      width: 100%;
    }

    #searchSection {
      display: none;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      padding-bottom: 15px;
    }

    .search-mode #searchSection {
      display: flex;
    }

    #searchResult {
      flex: 1 1 auto;
      min-height: calc(1.5em * 5 + 16px);
      overflow: auto;
      padding: 8px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      background-color: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #4caf50;
      border-radius: 4px;
      box-sizing: border-box;
      width: 100%;
    }

    #searchResult pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      font: inherit;
    }

    #searchResult .usage {
      background-color: #2d2d30;
      padding: 4px 8px;
    }

    #searchResult .status {
      color: #4fc3f7;
      margin-bottom: 6px;
    }

    #searchResult .error {
      color: #f44336;
    }

    #searchResult .hit {
      margin-bottom: 8px;
    }

    #searchResult .hit a {
      color: #8ab4f8;
    }

    #searchResult .hit-count,
    #searchResult .line-no {
      color: #858585;
      margin-left: 6px;
    }

    #searchResult .hit pre {
      padding-left: 16px;
    }

    #searchResult mark {
      background-color: #ffeb3b;
      color: #000;
    }

    /* job 실행(job) 상태 */
    #searchResult .job-row {
      margin-bottom: 2px;
    }

    #searchResult .job-row a {
      color: #8ab4f8;
    }

    #searchResult .st {
      display: inline-block;
      min-width: 76px;
      font-weight: bold;
      color: #858585;
    }

    #searchResult .st-QUEUED,
    #searchResult .st-WAITING,
    #searchResult .st-RUNNING {
      color: #4fc3f7;
    }

    #searchResult .st-SUCCESS {
      color: #4caf50;
    }

    #searchResult .st-FAILURE,
    #searchResult .st-ERROR {
      color: #f44336;
    }

    #searchResult .st-UNSTABLE,
    #searchResult .st-ABORTED,
    #searchResult .st-NOT_BUILT {
      color: #ff9800;
    }

    .button-container .stop-btn {
      background-color: #c62828;
      color: white;
    }

    .button-container .stop-btn:hover {
      background-color: #d32f2f;
    }

    /* Hide popup content in run dialog mode */
    .run-dialog-mode .popup-window {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Run Dialog Content (shown when URL param exists) -->
  <div id="runDialogContent" style="display: none;">
    <h3 id="previousParamsTitle">Previous Parameters</h3>
    <textarea id="previousParams" readonly></textarea>
    <h3>Enter Parameters</h3>
    <textarea id="paramsInput"></textarea>
    <div class="button-container">
      <button class="stop-btn" id="stopBtn" style="display: none;">Stop</button>
      <button class="cancel-btn" id="cancelBtn">Cancel</button>
      <button class="run-btn-exec" id="runBtn">Execute</button>
    </div>
    <div id="searchSection">
      <h3>Usage &amp; Result</h3>
      <div id="searchResult"></div>
    </div>
    <iframe id="hiddenFrame" name="hiddenFrame"></iframe>
  </div>

  <!-- Popup Content (shown by default) -->
  <div class="popup-window">
    <div class="container">
      <!-- Jenkins Logo Header -->
      <div class="header">
        <img src="icon48.png" alt="Jenkins" class="jenkins-logo">
        <h1 class="title">Jenkins Navigator</h1>
        <span class="version" id="versionInfo"></span>
      </div>

      <!-- Radio buttons for server selection (동적으로 생성됨) -->
      <div class="radio-group" id="radioGroup">
        <!-- JavaScript에서 동적으로 생성됩니다 -->
      </div>

      <!-- Action buttons (동적으로 생성됨) -->
      <div class="button-grid" id="buttonGrid">
        <!-- JavaScript에서 동적으로 생성됩니다 -->
      </div>
    </div>
  </div>

  <script src="job_search.js"></script>
  <script src="job_remove_history.js"></script>
  <script src="job_trigger.js"></script>
  <script src="run_dialog.js"></script>
</body>
</html>
